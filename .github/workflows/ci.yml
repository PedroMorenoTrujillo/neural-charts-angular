name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          archive="$(node -p "require('./package-lock.json').packages['node_modules/@neural-charts/web'].resolved")"
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          for attempt in {1..20}; do
            if npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$log"; then
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" == 20 ]] || ! grep -q 'code E404' "$log" || ! grep -Fq "404 Not Found - GET $archive" "$log"; then
              exit "$status"
            fi
            echo "::notice::The Web renderer archive is pending on npm. Retrying installation."
            sleep 15
          done
      - run: npm run build
